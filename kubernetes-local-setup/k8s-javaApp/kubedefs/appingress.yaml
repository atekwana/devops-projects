# ============================================================
# Ingress
# ============================================================
#
# Configures external access to Services via:
# - Externally-reachable URLs
# - Load balancing
# - SSL/TLS termination
# - Name-based virtual hosting
#
# Requires an Ingress controller (e.g. nginx) to fulfil rules.
#
# Note: Ingress only handles HTTP/HTTPS traffic.
# For other ports/protocols use:
# - Service.Type=NodePort
# - Service.Type=LoadBalancer
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vpro-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: kacetech.dev
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vproapp-service
                port:
                  number: 8080
