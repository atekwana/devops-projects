# ============================================================
# Creating a Deployment (APP)
# ============================================================
#
# - Rollout a ReplicaSet: creates Pods in the background
# - Update Pod state: gradually scales new ReplicaSet up,
#   old one down at a controlled rate
# - Rollback: revert to an earlier revision if unstable
# - Scale up: handle increased load
# - Pause/resume: apply multiple fixes before rolling out
# - Monitor status: detect stuck rollouts
# - Clean up: remove older ReplicaSets no longer needed
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
  labels:
    app: vproapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vproapp
  template:
    metadata:
      labels:
        app: vproapp
    spec:
      containers:
        - name: vproapp
          image: vprocontainers/vprofileapp
          imagePullPolicy: Always
          ports:
            - name: vproapp-port
              containerPort: 8080
      initContainers: # comes up and completes tasks before actual containers come up
        - name: init-mydb
          image: busybox:1.28
          command:
            [
              "sh",
              "-c",
              "until nslookup vprodb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for init-mydb; sleep 2; done",
            ]
        - name: init-memcache
          image: busybox:1.28
          command:
            [
              "sh",
              "-c",
              "until nslookup vprocache01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for init-memcache; sleep 2; done",
            ]
        - name: init-rabbitmq
          image: busybox:1.28
          command:
            [
              "sh",
              "-c",
              "until nslookup vprocache01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for init-rabbitmq; sleep 2; done",
            ]
