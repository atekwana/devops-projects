# ============================================================
# Creating a Deployment (RabbitMQ)
# ============================================================
#
# - Rollout a ReplicaSet: creates Pods in the background
# - Update Pod state: gradually scales new ReplicaSet up,
#   old one down at a controlled rate
# - Rollback: revert to an earlier revision if unstable
# - Scale up: handle increased load
# - Pause/resume: apply multiple fixes before rolling out
# - Monitor status: detect stuck rollouts
# - Clean up: remove older ReplicaSets no longer needed
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprormq
  labels:
    app: vprormq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vprormq
  template:
    metadata:
      labels:
        app: vprormq
    spec:
      containers:
        - name: vprormq
          image: rabbitmq
          ports:
            - name: vprormq-port
              containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: rmq-pass
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
